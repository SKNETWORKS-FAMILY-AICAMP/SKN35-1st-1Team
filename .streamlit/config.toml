[theme]
# 앱 메인색상 (강조색) — 탭 밑줄·위젯 포커스·아이콘 등 전역 적용
primaryColor = "#8d9a59"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F3F5"
textColor = "#1B1B1B"
font = "Pretendard Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css, sans-serif"

# 접근성: 장애인 이용자 대상 — 기본 글씨를 키운다
baseFontSize = 18